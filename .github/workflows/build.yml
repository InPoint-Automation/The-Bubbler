name: Build (Nuitka)
on:
  push:
    branches: [master]
  workflow_dispatch: {}
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: Bubbler-linux
            lowmem: "0"
          - os: windows-latest
            artifact: Bubbler-windows
            lowmem: "1"
          - os: macos-latest
            artifact: Bubbler-macos
            lowmem: "1"
    runs-on: ${{ matrix.os }}
    env:
      BUBBLER_VISION: "1"
      BUBBLER_JOBS: "2"
      BUBBLER_LOWMEM: ${{ matrix.lowmem }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            patchelf binutils clang ccache \
            libgl1 libxrender1 libxcb-cursor0 libegl1 \
            libxkbcommon0 libdbus-1-3
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Nuitka + ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Nuitka
            ~/AppData/Local/Nuitka/Nuitka
            ~/Library/Caches/Nuitka
            ~/.cache/ccache
            ~/AppData/Local/ccache
            ~/Library/Caches/ccache
          key: nuitka-${{ runner.os }}-${{ hashFiles('requirements-build-*.txt') }}-${{ github.run_id }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ hashFiles('requirements-build-*.txt') }}-
            nuitka-${{ runner.os }}-
      - name: Create build venv
        run: python packaging/make_build_venv.py
      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: .build-venv/bin/python packaging/build.py
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: .build-venv\Scripts\python packaging\build.py
      - name: Self-test bundle (Windows)
        if: runner.os == 'Windows'
        run: bin\Bubbler.exe --selftest
      - name: Self-test bundle (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a bin/Bubbler.dist/Bubbler --selftest
      - name: Self-test bundle (macOS)
        if: runner.os == 'macOS'
        run: bin/Bubbler.app/Contents/MacOS/Bubbler --selftest
      - name: Package AppImage (Linux)
        if: runner.os == 'Linux'
        run: .build-venv/bin/python packaging/make_appimage.py
      - name: Package macOS .dmg
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname Bubbler -srcfolder bin/Bubbler.app \
            -ov -format UDZO bin/Bubbler-macos.dmg
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            bin/Bubbler.exe
            bin/Bubbler-x86_64.AppImage
            bin/Bubbler-macos.dmg
          if-no-files-found: ignore
          retention-days: 14
      - name: Detect release tag + notes
        id: reltag
        shell: bash
        run: |
          git fetch --tags --force origin || true
          TAG=$(git tag --points-at HEAD | grep -E '^v' | head -n1 || true)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag on HEAD: '${TAG:-<none>}'"
          : > RELEASE_NOTES.md   # notes = version line + this version's CHANGELOG section
          if [ -n "$TAG" ] && [ -f CHANGELOG.md ]; then
            printf '%s\n' "$TAG" > RELEASE_NOTES.md
            awk -v t="$TAG" '
              $0 ~ "^### Version " t "[[:space:]]*$" {f=1; next}
              f && /^### Version / {exit}
              f {print}
            ' CHANGELOG.md >> RELEASE_NOTES.md
          fi
      - name: Attach to release
        if: success() && steps.reltag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.reltag.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            bin/Bubbler.exe
            bin/Bubbler-x86_64.AppImage
            bin/Bubbler-macos.dmg
          fail_on_unmatched_files: false